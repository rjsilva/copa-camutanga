name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Só os arquivos do site (sem specs/, .specify/, .claude/ e testes)
      - name: Montar pasta do site
        run: |
          mkdir -p _site
          cp index.html tabela.html classificacao.html times.html fase-final.html regulamento.html avisos.html _site/
          cp -r css fonts img _site/
          mkdir -p _site/js
          cp js/dados.js js/logica.js js/componentes.js js/paginas.js _site/js/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
